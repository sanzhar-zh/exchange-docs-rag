name: retrieval quality

# The tests in checks.yml assert that the code does what it says. They cannot
# see the failure that matters most here: a change to chunking, to the exclusion
# rules or to fusion that leaves every test passing and costs several points of
# recall. This job rebuilds the index from the live documentation and fails if
# the measured numbers fall below a floor.
#
# It runs on pull requests that touch retrieval, weekly, and on request. Weekly
# matters because the corpus is not vendored: the exchanges rewrite their own
# documentation, and a page that was renamed upstream turns an expected answer
# into a permanent miss. That is worth learning from a scheduled run rather than
# from a number that has been quietly wrong for a month.

on:
  pull_request:
    paths:
      - ingest.py
      - search.py
      - keyword_search.py
      - store.py
      - config.py
      - eval/**
      - scripts/fetch_docs.py
      - .github/workflows/retrieval-quality.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # The default wheel for torch carries the CUDA runtime, which is some two
      # gigabytes of no use on a CPU runner. Installing the CPU build first
      # leaves the dependency satisfied when sentence-transformers asks for it.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1.5

      - name: Fetch the documentation
        run: python scripts/fetch_docs.py

      - name: Build the index
        run: python ingest.py

      # Floors sit below the current measurement rather than at it. The question
      # is whether a change made retrieval worse, not whether it moved: shipped
      # numbers are hit@5 0.71 and MRR 0.540.
      - name: Measure retrieval
        run: python eval/run_eval.py --min-hit 0.68 --min-mrr 0.50
