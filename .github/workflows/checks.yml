name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt, not requirements.txt: these tests never load the
      # index, the embedding model or a provider, so the job does not install
      # torch and finishes in about a second rather than several minutes.
      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The build alone would not catch a type error in a client component that
      # is never rendered during it, so the type check runs on its own.
      - run: npx tsc --noEmit

      - run: npm run build
